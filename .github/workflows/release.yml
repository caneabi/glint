name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet build Glint.csproj -c Release -p:Version=$version
          Copy-Item bin/Release/net48/Glint.exe Glint.exe
          (Get-FileHash Glint.exe -Algorithm SHA256).Hash.ToLower() + "  Glint.exe" | Out-File -Encoding ascii Glint.exe.sha256
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Glint.exe Glint.exe.sha256 --generate-notes
